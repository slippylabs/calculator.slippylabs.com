    <h1>CALCULATOR</h1>
    <p class="subtitle">Everyday arithmetic. Click the keys or just type — number keys, + − * / work, Enter for =, Esc to clear.</p>

<script>
const displayEl = document.getElementById('calc-display');
const exprEl = document.getElementById('calc-expr');

let current = '0';
let previous = null;
let pendingOp = null;
// True right after an operator, %, or "=" — the next digit typed should
// start a brand new number instead of appending to what's on screen.
let resetNext = false;

function formatNumber(n) {
  if (!isFinite(n)) return 'Error';
  const rounded = Math.round((n + Number.EPSILON) * 1e10) / 1e10;
  return rounded.toString();
}

function updateExprLine() {
  if (pendingOp && previous !== null) {
    exprEl.textContent = `${formatNumber(previous)} ${pendingOp}`;
  } else {
    exprEl.textContent = ' ';
  }
}

function render() {
  displayEl.textContent = current;
  updateExprLine();
}

function inputDigit(d) {
  if (resetNext) {
    current = d;
    resetNext = false;
    render();
    return;
  }
  if (current === '0') {
    current = d;
  } else {
    current += d;
  }
  render();
}

function inputDecimal() {
  if (resetNext) {
    current = '0.';
    resetNext = false;
    render();
    return;
  }
  if (!current.includes('.')) {
    current += '.';
    render();
  }
}

function clearAll() {
  current = '0';
  previous = null;
  pendingOp = null;
  resetNext = false;
  render();
}

function backspace() {
  if (resetNext) return;
  current = current.length > 1 ? current.slice(0, -1) : '0';
  render();
}

function compute(a, b, op) {
  switch (op) {
    case '+': return a + b;
    case '−': return a - b;
    case '×': return a * b;
    case '÷': return b === 0 ? NaN : a / b;
    default: return b;
  }
}

function applyOp(nextOp) {
  const value = parseFloat(current);
  if (pendingOp && previous !== null && !resetNext) {
    const result = compute(previous, value, pendingOp);
    previous = result;
    current = formatNumber(result);
  } else {
    previous = value;
  }
  pendingOp = nextOp;
  resetNext = true;
  render();
}

function percent() {
  const value = parseFloat(current) / 100;
  current = formatNumber(value);
  resetNext = true;
  render();
}

function equals() {
  if (pendingOp === null || previous === null) return;
  const value = parseFloat(current);
  const result = compute(previous, value, pendingOp);
  current = formatNumber(result);
  previous = null;
  pendingOp = null;
  resetNext = true;
  render();
}

document.querySelector('.calc-grid').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.dataset.digit !== undefined) inputDigit(btn.dataset.digit);
  else if (btn.dataset.op !== undefined) applyOp(btn.dataset.op);
  else if (btn.dataset.action === 'clear') clearAll();
  else if (btn.dataset.action === 'back') backspace();
  else if (btn.dataset.action === 'decimal') inputDecimal();
  else if (btn.dataset.action === 'percent') percent();
  else if (btn.dataset.action === 'equals') equals();
});

const keyOpMap = { '+': '+', '-': '−', '*': '×', '/': '÷' };

window.addEventListener('keydown', (e) => {
  if (e.key >= '0' && e.key <= '9') { inputDigit(e.key); return; }
  if (e.key === '.') { inputDecimal(); return; }
  if (keyOpMap[e.key]) { applyOp(keyOpMap[e.key]); e.preventDefault(); return; }
  if (e.key === '%') { percent(); return; }
  if (e.key === 'Enter' || e.key === '=') { equals(); e.preventDefault(); return; }
  if (e.key === 'Escape') { clearAll(); return; }
  if (e.key === 'Backspace') { backspace(); return; }
});

render();
</script>
